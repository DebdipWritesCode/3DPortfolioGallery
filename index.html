<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Debdip Mukherjee</title>
</head>

<body>
  <div class="gallery-loader" id="gallery-loader" role="status" aria-live="polite" aria-label="Loading gallery assets">
    <div class="loader-layout">
      <div class="loader-header">
        <span>Debdip Mukherjee</span>
        <span id="loader-percent">0%</span>
      </div>
      <div class="loader-floorplan" aria-hidden="true">
        <span class="loader-wall wall-top"></span>
        <span class="loader-wall wall-right"></span>
        <span class="loader-wall wall-bottom"></span>
        <span class="loader-wall wall-left"></span>
        <span class="loader-art art-1"></span>
        <span class="loader-art art-2"></span>
        <span class="loader-art art-3"></span>
        <span class="loader-art art-4"></span>
        <span class="loader-camera"></span>
      </div>
      <div class="loader-footer">
        <p id="loader-status">Loading gallery assets</p>
        <div class="loader-progress" aria-hidden="true">
          <span id="loader-progress-bar"></span>
        </div>
      </div>
    </div>
  </div>
  <div class="background_menu" id="background_menu">
    <div id="menu">
      <div id="img-container">
        <img src="./artworks/0.jpg" alt="Starry Night">
      </div>
      <div class="content">
        <h1>Welcome to My Portfolio Gallery</h1>
        <h4>Crafted by Debdip Mukherjee using 💓, code, and Three.js</h4>
        <h5>Step closer to each painting — each has a story to tell.</h5>
        <div class="">
          <div class="controls">
            <img class="keys-img" src="./images/keys.png" alt="wasd">
            <p>to move</p>
            <img class="f11-img" src="./images/f11.jpg" alt="f11">
            <p>to toggle fullscreen</p>
          </div>
        </div>
        <button id="play-btn">
          Enter Gallery
        </button>
      </div>
    </div>
  </div>
  <div class="painting-info"></div>
  <script type="module" src="/main.js"></script>
</body>

</html>
